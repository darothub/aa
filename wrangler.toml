name = "aa"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# The live site. Bound as a custom domain, so Cloudflare manages the DNS record
# and the certificate; the binding follows the Worker, not a given version.
[[routes]]
pattern = "wedding.aishatandabdul.com"
custom_domain = true

# Built by `opennextjs-cloudflare build`. Static files are served straight from
# the assets binding; anything else falls through to the Worker.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Holds guest-uploaded event photos. Objects are served back out through
# /api/photos/[...key] (app/api/photos/[...key]/route.ts) rather than a public
# bucket URL, since this bucket has no CDN domain of its own.
[[r2_buckets]]
binding = "EVENT_PHOTOS"
bucket_name = "aa-event-photos"

# Passcodes and the signing key are secrets, set with `wrangler secret put`
# rather than declared here — this file is committed. Listed for reference:
#   GUEST_PASSCODE     the code printed beside the venue QR
#   COUPLE_PASSCODE    private to the couple; additionally unlocks /gallery
#   SESSION_SECRET     random string used to sign the session cookie
#   ANTHROPIC_API_KEY  Claude API key used by /api/travel-chat

# Caps how often one visitor can call the Claude-backed /api/travel-chat route,
# so a script (or a guest mashing send) can't run up the Anthropic bill.
# namespace_id is an arbitrary label Cloudflare uses to key this limiter, not
# a resource that needs creating first.
[[ratelimits]]
# `name`, not `binding` — wrangler rejects `binding` here, unlike every
# other binding block in this file.
name = "TRAVEL_CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[observability]
enabled = true
